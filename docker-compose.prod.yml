# Production override.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Terminates TLS at nginx (mount a certificate/key, or point at an upstream
# reverse proxy / TLS-terminating load balancer). Requires:
#   USE_HTTPS=true
#   PUBLIC_ORIGIN=https://chat.example.com
#
# Options: OTEL_EXPORTER_ENDPOINT for OpenTelemetry (Prometheus/Grafana-ready).

services:
  backend:
    environment:
      USE_HTTPS: "true"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-}
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2

  frontend:
    environment:
      API_BASE_URL: http://backend:8000
    mem_limit: 256m
    cpus: 1
    security_opt:
      - no-new-privileges:true

  postgres:
    mem_limit: 512m
    cpus: 1
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB"]

  redis:
    mem_limit: 256m
    cpus: 1

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/krypte.conf:ro
      - ${TLS_CERT_PATH:-/etc/ssl/cert.pem}:/etc/ssl/cert.pem:ro
      - ${TLS_KEY_PATH:-/etc/ssl/key.pem}:/etc/ssl/key.pem:ro
    ports:
      - "443:443"
      - "80:80"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null https://localhost/ --no-check-certificate || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5